[Unit]
OnFailure=enclave-backup-notify@%n.service

[Service]
# Preserve the notifier, its recipient and failure hook for server recovery.
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/lib/enclave-operations/backup.py backup --project liberator --maintenance-file /run/enclave-backup/maintenance --config-path /etc/enclave/production.env --config-path /etc/caddy/Caddyfile --config-path /var/lib/caddy --config-path /etc/enclave-backup/production-backup.env --config-path /etc/enclave-backup/restic-password.key --config-path /etc/systemd/journald.conf.d/enclave-retention.conf --config-path /etc/enclave-backup/notifications.env --config-path /usr/local/lib/enclave-operations --config-path /etc/systemd/system/enclave-backup.service --config-path /etc/systemd/system/enclave-backup.timer --config-path /etc/systemd/system/enclave-backup.timer.d --config-path /etc/systemd/system/enclave-backup.service.d --config-path /etc/systemd/system/enclave-backup-notify@.service --config-path /etc/systemd/system/enclave-monitor.service --config-path /etc/systemd/system/enclave-monitor.timer
