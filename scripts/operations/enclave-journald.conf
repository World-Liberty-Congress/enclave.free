# Install as /etc/systemd/journald.conf.d/enclave-retention.conf on the Linux
# production host. This budget includes host service and container logs.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=64M
RuntimeMaxUse=128M
RuntimeMaxFileSize=16M
MaxRetentionSec=7day
MaxFileSec=1day
