events {}

http {
  limit_req_zone $binary_remote_addr zone=enclave_auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=enclave_ai:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=enclave_query:10m rate=90r/m;
  limit_req_zone $binary_remote_addr zone=enclave_upload:10m rate=20r/m;
  limit_req_status 429;

  server {
    listen 18000;
    client_max_body_size 100m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;

    location = /llm/chat {
      limit_req zone=enclave_ai burst=20 nodelay;
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_pass http://sage:3000;
    }

    location = /llm/chat/stream {
      limit_req zone=enclave_ai burst=20 nodelay;
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_buffering off;
      proxy_cache off;
      proxy_pass http://sage:3000;
    }

    location = /llm/chat/user-lookup-result {
      client_max_body_size 4k;
      proxy_pass http://sage:3000;
    }

    location = /llm/chat/conversation-lookup-result {
      client_max_body_size 4k;
      proxy_pass http://sage:3000;
    }

    location = /query {
      limit_req zone=enclave_query burst=15 nodelay;
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_pass http://sage:3000;
    }

    location = /query/sessions {
      limit_req zone=enclave_query burst=15 nodelay;
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_pass http://sage:3000;
    }

    location = /query/sessions/ {
      limit_req zone=enclave_query burst=15 nodelay;
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_pass http://sage:3000;
    }

    location /query/session/ {
      limit_req zone=enclave_query burst=15 nodelay;
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_pass http://sage:3000;
    }

    location = /auth/magic-link {
      limit_req zone=enclave_auth burst=5 nodelay;
      proxy_pass http://core-backend:18000;
    }

    location = /auth/verify {
      limit_req zone=enclave_auth burst=5 nodelay;
      proxy_pass http://core-backend:18000;
    }

    location = /admin/auth {
      limit_req zone=enclave_auth burst=5 nodelay;
      proxy_pass http://core-backend:18000;
    }

    location = /ingest/upload {
      limit_req zone=enclave_upload burst=5 nodelay;
      proxy_pass http://core-backend:18000;
    }

    location = /ingest/upload/batch {
      limit_req zone=enclave_upload burst=5 nodelay;
      proxy_pass http://core-backend:18000;
    }

    location = /session-defaults {
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_pass http://sage:3000;
    }

    location /admin/ai-config {
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_pass http://sage:3000;
    }

    location = /admin/tools/execute {
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_pass http://sage:3000;
    }

    location / {
      proxy_pass http://core-backend:18000;
    }
  }
}
