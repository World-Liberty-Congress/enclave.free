# SearXNG configuration for Enclave
# https://docs.searxng.org/admin/settings/settings.html

# Keep the upstream defaults for these engines, without silently enabling the
# other default providers. These three were probed from the Liberator host.
use_default_settings:
  engines:
    keep_only:
      - bing
      - seznam
      - mwmbl

general:
  instance_name: "Enclave Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  image_proxy: false
  method: "GET"
  secret_key: "enclave-searxng-secret-key"

ui:
  static_use_hash: true
  default_theme: simple
  results_on_new_tab: false

# Independent providers are queried together so one blocked provider does not
# leave the Agent without results. No search API subscription is required.
engines:
  - name: bing
    disabled: false
  - name: seznam
    disabled: false
  - name: mwmbl
    disabled: false
