services:
  core-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enclave-core-backend
    expose:
      - "18000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ENCLAVE_ENV=${ENCLAVE_ENV:-development}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-tinfoil}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://tinfoil-proxy:8089/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-${LLM_API_KEY:-}}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - LLM_PROVIDER=${LLM_PROVIDER:-sage}
      - LLM_API_URL=${LLM_API_URL:-http://tinfoil-proxy:8089/v1}
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY is required}
      - LLM_MODEL=${TINFOIL_MODEL:-glm-5-3-flash}
      - SAGE_WEB_URL=http://sage:3000
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - SQLITE_PATH=/data/enclave.db
      - INTERNAL_AGENT_TOKEN=${INTERNAL_AGENT_TOKEN:-dev-internal-agent-token}
      - CONTENT_ENCRYPTION_KEY=${CONTENT_ENCRYPTION_KEY:-}
      - DOCUMENT_ARTIFACT_ENCRYPTION=${DOCUMENT_ARTIFACT_ENCRYPTION:-auto}
      # Magic Link Auth configuration
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - MOCK_EMAIL=${MOCK_EMAIL:-true}
      # SMTP configuration (optional, not needed if MOCK_EMAIL=true)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Enclave <noreply@localhost>}
      # Simulation settings for development/testing
      - SIMULATE_USER_AUTH=${SIMULATE_USER_AUTH:-false}
      - SIMULATE_ADMIN_AUTH=${SIMULATE_ADMIN_AUTH:-false}
      # Shared rate limiting store
      - RATE_LIMIT_BACKEND=${RATE_LIMIT_BACKEND:-valkey}
      - RATE_LIMIT_VALKEY_URL=${RATE_LIMIT_VALKEY_URL:-redis://valkey:6379/0}
      # Only known gateway peers may supply the client IP to Uvicorn.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:18000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      qdrant:
        condition: service_healthy
      tinfoil-proxy:
        condition: service_healthy
      searxng:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./backend/app:/app
      - ./uploads:/uploads
      - embedding_cache:/root/.cache/huggingface
      - sqlite_data:/data
    networks:
      - enclave-net

  sage:
    build:
      context: ./runtime/sage
      dockerfile: Dockerfile
    container_name: enclave-sage-web
    command: ["/app/enclave_web"]
    expose:
      - "3000"
    volumes:
      - sage_workspace:/workspace
    environment:
      # Operator-applied runtime values may be supplied with:
      # docker compose --env-file .env --env-file runtime/generated/sage.env -f docker-compose.infra.yml -f docker-compose.app.yml up -d sage
      - DATABASE_URL=postgres://sage:sage@postgres:5432/sage
      - ENCLAVE_ENV=${ENCLAVE_ENV:-development}
      - TINFOIL_API_URL=${TINFOIL_API_URL:-http://tinfoil-proxy:8089/v1}
      - TINFOIL_API_KEY=${LLM_API_KEY:?LLM_API_KEY is required}
      - TINFOIL_MODEL=${TINFOIL_MODEL:-glm-5-3-flash}
      - TINFOIL_REASONING_EFFORT=${TINFOIL_REASONING_EFFORT:-low}
      - MAPLE_API_KEY=${MAPLE_API_KEY:-}
      - MAPLE_API_URL=${MAPLE_API_URL:-http://maple-proxy:8080/v1}
      - TINFOIL_EMBEDDING_MODEL=${TINFOIL_EMBEDDING_MODEL:-nomic-embed-text}
      - SAGE_WORKSPACE=/workspace
      - ENCLAVE_WEB_PORT=3000
      - ENCLAVE_BACKEND_URL=http://core-backend:18000
      - INTERNAL_AGENT_TOKEN=${INTERNAL_AGENT_TOKEN:-dev-internal-agent-token}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - SEARXNG_URL=http://searxng:8080
      - USER_SESSION_COOKIE_NAME=${USER_SESSION_COOKIE_NAME:-enclave_session}
      - ADMIN_SESSION_COOKIE_NAME=${ADMIN_SESSION_COOKIE_NAME:-enclave_admin_session}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME:-enclave_csrf}
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      tinfoil-proxy:
        condition: service_healthy
      core-backend:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - enclave-net

  backend:
    image: nginx:1.27-alpine
    container_name: enclave-api-gateway
    ports:
      - "127.0.0.1:18000:18000"
    depends_on:
      core-backend:
        condition: service_healthy
      sage:
        condition: service_healthy
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/trusted-proxies:/etc/nginx/trusted-proxies:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:18000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - enclave-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: enclave-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - enclave-net

volumes:
  embedding_cache:
  sqlite_data:
  sage_workspace:

networks:
  enclave-net:
    driver: bridge
