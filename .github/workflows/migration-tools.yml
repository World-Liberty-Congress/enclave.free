name: Production migration tools

on:
  pull_request:
    paths:
      - scripts/operations/**
      - backend/app/**
      - .github/workflows/migration-tools.yml
  push:
    branches: [main]
    paths:
      - scripts/operations/**
      - backend/app/**
      - .github/workflows/migration-tools.yml

permissions:
  contents: read

jobs:
  carryover-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install lightweight operations test dependencies
        run: python -m pip install fastapi 'pydantic>=2.6,<3' httpx itsdangerous pycryptodome
      - name: Verify migration boundary and backup failure handling
        run: python -m unittest discover -s scripts/operations -p test_operations.py -v
